<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Purana Bazaar - your neighbourhood grocery marketplace.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purana Bazaar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Purana Bazaar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f7f8f7;
    }

    /* Shown until Flutter paints its first frame. Without this the page is
       plain white/black while the engine and CanvasKit are still loading. */
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f7f8f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    #boot-loader.hidden {
      opacity: 0;
    }

    #boot-loader .mark {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0c831f, #075e17);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 34px rgba(12, 131, 31, 0.30);
    }

    #boot-loader .mark svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }

    #boot-loader .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #17211b;
    }

    #boot-loader .tagline {
      margin-top: -10px;
      font-size: 12px;
      font-weight: 500;
      color: #66736b;
    }

    #boot-loader .spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2.4px solid #d8e6da;
      border-top-color: #0c831f;
      animation: boot-spin 0.8s linear infinite;
    }

    #boot-loader .hint {
      max-width: 280px;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      color: #8a958e;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h16l-1.2 10.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 4Zm2.6 2 .9 8h9l.9-8H6.6Z"/>
        <path d="M9 18.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm9 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/>
      </svg>
    </div>
    <div class="name">Purana Bazaar</div>
    <div class="tagline">Everyday essentials. Nearby shops.</div>
    <div class="spinner"></div>
    <div class="hint">Starting the app&hellip; the first launch can take a few seconds.</div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('boot-loader');
      if (!loader) return;

      function hideLoader() {
        if (!loader || loader.classList.contains('hidden')) return;
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 260);
      }

      // Flutter injects <flutter-view> (or flt-glass-pane) once the engine
      // starts. Hide the loader as soon as that happens.
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          observer.disconnect();
          hideLoader();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      // Safety net: never leave a permanent splash if the observer misses it.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
            hideLoader();
          }
        }, 1200);
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Lazily loads Razorpay Checkout the first time a customer pays online.
    // The helper returns a Promise so Dart can await the final outcome.
    (function () {
      var loading = null;

      function loadCheckout() {
        if (window.Razorpay) return Promise.resolve(true);
        if (loading) return loading;
        loading = new Promise(function (resolve) {
          var script = document.createElement('script');
          script.src = 'https://checkout.razorpay.com/v1/checkout.js';
          script.async = true;
          script.onload = function () { resolve(true); };
          script.onerror = function () { resolve(false); };
          document.head.appendChild(script);
        });
        return loading;
      }

      window.pbStartRazorpay = function (options) {
        return loadCheckout().then(function (loaded) {
          if (!loaded || !window.Razorpay) {
            return {
              ok: false,
              error: 'Could not load Razorpay Checkout. Check your internet connection and try again.'
            };
          }
          return new Promise(function (resolve) {
            var settled = false;
            function finish(result) {
              if (settled) return;
              settled = true;
              resolve(result);
            }
            try {
              var checkout = new window.Razorpay({
                key: options.key,
                amount: options.amount,
                currency: options.currency || 'INR',
                name: options.name || 'Purana Bazaar',
                description: options.description || '',
                order_id: options.order_id,
                prefill: options.prefill || {},
                notes: options.notes || {},
                theme: options.theme || { color: '#0c831f' },
                handler: function (response) {
                  finish({
                    ok: true,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature
                  });
                },
                modal: {
                  ondismiss: function () { finish({ ok: false, cancelled: true }); }
                }
              });
              checkout.on('payment.failed', function (response) {
                var description = response && response.error && response.error.description;
                finish({ ok: false, error: description || 'The payment failed. Please try again.' });
              });
              checkout.open();
            } catch (error) {
              finish({ ok: false, error: String(error && error.message ? error.message : error) });
            }
          });
        });
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
