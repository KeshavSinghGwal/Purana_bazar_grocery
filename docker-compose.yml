services:
  postgres:
    image: postgres:17-alpine
    container_name: purana-bazaar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: purana_bazaar
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - purana_bazaar_pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purana_bazaar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purana_bazaar_pgdata:
