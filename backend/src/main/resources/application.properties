spring.application.name=purana-bazaar-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/purana_bazaar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET:purana-bazaar-local-dev-secret-key-change-me-please-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.delivery.base-fee=${DELIVERY_BASE_FEE:19}
app.delivery.free-above=${DELIVERY_FREE_ABOVE:199}
app.delivery.currency=INR
app.timezone=Asia/Kolkata
app.seed.enabled=${SEED_ENABLED:true}
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
