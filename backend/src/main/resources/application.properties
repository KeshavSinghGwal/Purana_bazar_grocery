spring.application.name=purana-bazaar-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/purana_bazaar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET:purana-bazaar-local-dev-secret-key-change-me-please-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.delivery.base-fee=${DELIVERY_BASE_FEE:19}
app.delivery.free-above=${DELIVERY_FREE_ABOVE:199}
app.delivery.currency=INR
app.timezone=Asia/Kolkata
app.seed.enabled=${SEED_ENABLED:true}
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Razorpay online payments. Leave the keys blank for Cash on Delivery only.
# Set RAZORPAY_MOCK_ENABLED=true to rehearse the full flow locally without keys.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.mock-enabled=${RAZORPAY_MOCK_ENABLED:false}
app.payment.pending-timeout-minutes=${PAYMENT_PENDING_TIMEOUT_MINUTES:120}
app.payment.expiry-scan-ms=${PAYMENT_EXPIRY_SCAN_MS:300000}

# Firebase Cloud Messaging. Provide a service-account JSON (raw, base64 or file path).
app.fcm.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
app.fcm.service-account-file=${FIREBASE_SERVICE_ACCOUNT_FILE:}
app.fcm.project-id=${FIREBASE_PROJECT_ID:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

